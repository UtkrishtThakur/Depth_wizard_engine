version: "3.9"

networks:
  internal:
    external: true

  traefik-public:
    external: true

services:

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────────────────────
  prod-depthwizard-postgres:
    image: postgres:16-alpine
    container_name: prod-depthwizard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-depthwizard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-depthwizard}

    networks:
      - internal

    volumes:
      - prod-depthwizard-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-depthwizard} -d ${POSTGRES_DB:-depthwizard}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Database migrations
  # ─────────────────────────────────────────────────────────────
  prod-depthwizard-migrate:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: prod-depthwizard-migrate
    restart: "no"

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      MODEL_ROOT: /app/models
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app:/app/api

    networks:
      - internal

    depends_on:
      prod-depthwizard-postgres:
        condition: service_healthy

    working_dir: /app/api

    command: [ "alembic", "upgrade", "head" ]

  # ─────────────────────────────────────────────────────────────
  # DepthWizard API
  # ─────────────────────────────────────────────────────────────
  depthwizard-api:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: prod-depthwizard-api
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      MODEL_ROOT: /app/models
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app:/app/api

    networks:
      - internal
      - traefik-public

    volumes:
      - prod-depthwizard-process-data:/app/data
      - ./models:/app/models:ro

    depends_on:
      prod-depthwizard-postgres:
        condition: service_healthy

      prod-depthwizard-migrate:
        condition: service_completed_successfully

    working_dir: /app/api

    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers" ]

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      # Router
      - "traefik.http.routers.depthwizard-api.rule=Host(`depthwizardapi.devlooper.co.in`)"
      - "traefik.http.routers.depthwizard-api.entrypoints=web"

      # Backend service
      - "traefik.http.services.depthwizard-api.loadbalancer.server.port=8000"

  # ─────────────────────────────────────────────────────────────
  # DepthWizard Generation Worker
  # ─────────────────────────────────────────────────────────────
  depthwizard-worker:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: prod-depthwizard-worker
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      MODEL_ROOT: /app/models
      DEVICE: ${DEVICE:-cpu}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2.0}
      PYTHONPATH: /app:/app/api

    networks:
      - internal

    volumes:
      - prod-depthwizard-process-data:/app/data
      - ./models:/app/models:ro

    depends_on:
      prod-depthwizard-postgres:
        condition: service_healthy

      prod-depthwizard-migrate:
        condition: service_completed_successfully

    working_dir: /app/api

    command: [ "python", "-m", "app.services.worker" ]

# ─────────────────────────────────────────────────────────────
# Persistent volumes
# ─────────────────────────────────────────────────────────────
volumes:

  # PostgreSQL database
  prod-depthwizard-postgres-data:

  # Process data, generated GLBs, artifacts, logs
  prod-depthwizard-process-data:
